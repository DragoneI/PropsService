<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prop Experts | Service en maintenance</title>

<!-- favicon -->
<link rel="shortcut icon" href="favicon.png" type="image/svg+xml">

<!-- google font link -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --prussian-blue: hsl(0, 0%, 20%);
    --dark-jungle-green: hsl(0, 0%, 10%);
    --cadet: hsl(0, 0%, 45%);
    --cultured-2: hsl(0, 0%, 96%);
    --white: hsl(0, 0%, 100%);
    --ff-nunito: "Nunito Sans", sans-serif;
    --ff-poppins: "Poppins", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }
  body {
    font-family: var(--ff-nunito);
    background: var(--prussian-blue);
    color: var(--white);
    font-size: 16px;
    line-height: 1.55;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { width: 100%; max-width: 970px; margin: 0 auto; padding: 0 20px; }

  /* En-tête */
  .site-head { display: flex; align-items: center; justify-content: space-between; padding: 24px 0; }
  .brand img { max-height: 50px; width: auto; object-fit: contain; }

  /* Conteneur de maintenance */
  .maintenance-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 0;
  }
  .maintenance-card {
    background: var(--white);
    color: var(--dark-jungle-green);
    border-radius: 24px;
    padding: 48px 32px;
    max-width: 560px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  }
  .maintenance-icon {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    background: var(--cultured-2);
    border-radius: 20px;
    display: grid;
    place-items: center;
    color: var(--prussian-blue);
  }
  .maintenance-icon svg {
    width: 32px;
    height: 32px;
    stroke-width: 2;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  h1 {
    font-family: var(--ff-poppins);
    font-weight: 700;
    font-size: clamp(24px, 5vw, 32px);
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--dark-jungle-green);
  }
  p {
    margin-top: 14px;
    color: var(--cadet);
    font-size: 16px;
    line-height: 1.6;
  }

  /* Pied de page */
  .foot { padding: 24px 0; font-size: 14px; color: rgba(255, 255, 255, 0.8); text-align: center; }

  @media (min-width: 640px) {
    .maintenance-card { padding: 60px 48px; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <header class="site-head">
      <a href="#" class="brand"><img src="prop.png" alt="Prop Experts"></a>
    </header>
  </div>

  <main class="maintenance-container">
    <div class="wrap" style="display: flex; justify-content: center;">
      <div class="maintenance-card">
        <div class="maintenance-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
          </svg>
        </div>
        <h1>Service indisponible en cours de maintenance</h1>
        <p>Nous améliorons actuellement nos systèmes pour vous offrir une meilleure expérience en Suisse. Nous serons de retour très prochainement.</p>
      </div>
    </div>
  </main>

  <footer class="wrap">
    <div class="foot">
      &copy; 2026 Prop Experts. Tous droits réservés | Partenaire immobilier en Suisse
    </div>
  </footer>

</body>
</html>
